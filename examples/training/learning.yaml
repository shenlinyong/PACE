# Synthetic training exercise, matched to examples/measured/config.yaml.
# For real training, copy the scientific contract from a compatible run manifest.
model_id: synthetic_classifier
data: learning.tsv
is_synthetic: true
context:
  species: synthetic
  assembly: toy_assembly
  context_id: toy_tissue
extra_features:
- H3K4me1
penalties:
- - 0.01
  - 0.01
- - 0.02
  - 0.01
folds: 3
seed: 17
calibrate: true
feature_contract:
  target_level: individual
  estimand: bulk_proxy
  activity_panel:
  - ATAC
  - H3K27ac
  activity_scales:
  - - ATAC
    - toy_signal
    - toy_mean
    - grid:500:mean
  - - H3K27ac
    - toy_signal
    - toy_mean
    - grid:500:mean
  contact_definition:
    contract_version: 1
    resolution: 500
    scale: toy_contact
    normalization_id: toy_mean
    balancing: null
    window_id: null
    resolution_bp: 500
    mode: observed
    near_diagonal_bp: 0
    near_diagonal_policy: prior_or_unresolved
    allow_prior_fallback: false
  candidate_construction:
    profile: canonical_grid
    window_bp: 500
    offset_bp: 0
    radius_bp: 5000000
    include_promoter_units: false
    promoter_weights: provided
  auxiliary_feature_policy:
    replicate_aggregation: equal_donor_mean
    methylation:
      minimum_coverage: 1
      promoter_upstream_bp: 2000
      promoter_downstream_bp: 500
    reference_cpg_sha256: null
  allocation_eta: 0.0
  evidence_policy:
    regime: measured
    contact_reliability: null
    contact_reliability_source: null
    minimum_callable_fraction: 0.0
    quality_stratum: default
    max_n_fraction: 0.05
    unrecorded_site_policy: require_callable
    asset_hashes: {}
