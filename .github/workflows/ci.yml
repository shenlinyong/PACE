name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest build
      - name: Tests
        run: python -m pytest tests -q
      - name: Build and test wheel outside checkout
        run: |
          python -m build
          python -m venv /tmp/pace-wheel
          /tmp/pace-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/pace-wheel/bin/pace --version
  minimum-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==1.26.4' 'PyYAML==6.0.3' pytest .
      - run: python -m pytest tests -q
  extras:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [io, ml]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[${{ matrix.extra }}]" pytest
      - run: python -m pytest tests -q
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev,io,ml]'
      - run: python -m pytest tests -q
      - run: ruff check src/pace_livestock tests
      - run: ruff format --check src/pace_livestock tests
      - run: python scripts/check_public_docs.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag pace:ci .
      - run: docker run --rm pace:ci --version
  conda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: pace
          auto-activate-base: false
      - name: Run installed Conda entry point
        shell: bash -el {0}
        run: pace --version
