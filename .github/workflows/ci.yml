name: Canonical software tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest build
      - name: Core, schema, genotype and command tests
        run: python -m pytest tests/test_canonical_*.py --ignore=tests/test_canonical_sequence.py -q
      - name: Build and test wheel outside checkout
        run: |
          python -m build
          python -m venv /tmp/pace-wheel
          /tmp/pace-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/pace-wheel/bin/pace-livestock demo --regime measured --out wheel-measured
          /tmp/pace-wheel/bin/pace-livestock demo --regime hybrid --out wheel-hybrid
          /tmp/pace-wheel/bin/pace-livestock demo --regime genome_only --out wheel-genome
  minimum-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==1.26.4' 'PyYAML==6.0.3' pytest .
      - run: python -m pytest tests/test_canonical_*.py --ignore=tests/test_canonical_sequence.py -q
  extras:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [io, sequence, ml]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: matrix.extra == 'sequence'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[${{ matrix.extra }}]" pytest
      - run: python -m pytest tests/test_canonical_*.py -q
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev,io,ml]'
      - run: python -m pytest tests -q
      - run: ruff check src/pace_livestock tests/test_canonical_*.py
      - run: ruff format --check src/pace_livestock tests/test_canonical_*.py
