name: Canonical software tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest build
      - name: Core, schema, genotype, command and public-documentation tests
        run: python -m pytest tests --ignore=tests/test_canonical_sequence.py -q
      - name: Build and test wheel outside checkout
        run: |
          python -m build
          python -m venv /tmp/pace-wheel
          /tmp/pace-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/pace-wheel/bin/PACE --version
          /tmp/pace-wheel/bin/PACE demo --regime measured --out wheel-measured
          /tmp/pace-wheel/bin/PACE demo --regime hybrid --out wheel-hybrid
          /tmp/pace-wheel/bin/PACE demo --regime genome_only --out wheel-genome
          /tmp/pace-wheel/bin/PACE measured --config wheel-measured/inputs/config.yaml --eta 0.5 --out wheel-fractional
  minimum-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==1.26.4' 'PyYAML==6.0.3' pytest .
      - run: python -m pytest tests --ignore=tests/test_canonical_sequence.py -q
  extras:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [io, sequence, ml]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: matrix.extra == 'sequence'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[${{ matrix.extra }}]" pytest
      - run: python -m pytest tests -q
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev,io,ml]'
      - run: python -m pytest tests -q
      - run: python scripts/check_public_docs.py
      - run: ruff check src/pace_livestock tests scripts/check_public_docs.py scripts/pace.py
      - run: ruff format --check src/pace_livestock tests scripts/check_public_docs.py scripts/pace.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag pace:ci .
      - name: Run three modes in the container as the host user
        run: |
          mkdir container-results
          docker run --rm pace:ci --version
          for regime in measured hybrid genome_only; do
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "$PWD/container-results:/work" pace:ci \
              demo --regime "$regime" --out "/work/$regime"
          done
  conda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: pace
          auto-activate-base: false
      - name: Run installed Conda entry point and examples
        shell: bash -el {0}
        run: |
          PACE --version
          for regime in measured hybrid genome_only; do
            PACE demo --regime "$regime" --out "conda-results/$regime"
          done
