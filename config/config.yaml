# PACE configuration. See docs/FORMULA.md; defaults are not learned optima.
random_seed: 42
results_dir: results/
biosamplesTable: config/config_biosamples.tsv
ref:
  chrom_sizes: reference/your_species/genome.chrom.sizes
  regions_blocklist: reference/your_species/blacklist.bed
  genes: reference/your_species/genes.bed
  genome_tss: reference/your_species/genes.TSS500bp.bed
  ubiquitous_genes: reference/UbiquitouslyExpressedGenes.txt
  qnorm: ''
  abc_thresholds: reference/abc_thresholds.tsv
activity_method: missing_geometric
accessibility:
  weight: 1.0
histone_marks:
  H3K27ac:
    enabled: true
    weight: 1.0
    description: Active enhancers and promoters
  H3K4me1:
    enabled: false
    weight: 0.8
    description: Enhancer mark
  H3K4me3:
    enabled: false
    weight: 0.5
    description: Active promoters
  H3K36me3:
    enabled: false
    weight: 0.3
    description: Transcribed gene bodies
  H3K9ac:
    enabled: false
    weight: 0.6
    description: Active chromatin
  H3K27me3:
    enabled: false
    weight: 0.5
    inhibitory: true
    description: Polycomb repression
  H3K9me3:
    enabled: false
    weight: 0.5
    inhibitory: true
    description: Heterochromatin
methylation:
  enabled: false
  weight: 0.5
  context: CG
  min_coverage: 4
  transform_method: linear
transcription_factors:
  enabled: false
  default_weight: 0.3
  specific_tfs: {}
expression:
  enabled: false
  value_column: TPM
  min_expression: 1.0
  weight_method: none
eqtl_validation:
  enabled: false
  pvalue_threshold: 1e-5
  window: 1000
  add_to_output: true
  columns:
    chr: chr
    pos: pos
    gene: gene
    pvalue: pvalue
    beta: beta
params_macs:
  pval: 0.1
  genome_size: 2.5e9
  threads: 10
params_candidate:
  peakExtendFromSummit: 250
  nStrongestPeaks: 150000
params_neighborhoods:
  use_qnorm: false
params_predict:
  flags: ''
  hic_gamma: 1.024238616787792
  hic_scale: 5.9594510043736655
  hic_pseudocount_distance: 5000
params_filter_predictions:
  score_column: PACE.Score
  threshold: 0.02
  include_self_promoter: true
  only_expressed_genes: false
ml_integration:
  enabled: false
  status: archived_not_in_primary_model
output_options:
  output_signal_scores: true
  output_components: true
  generate_plots: true
  format: tsv
ABC_DIR_PATH: ''
