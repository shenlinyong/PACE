[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pace-livestock"
version = "0.5.0"
description = "PACE: auditable activity-contact regulatory support for livestock research"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Linyong Shen (申林用)"}]
dependencies = ["numpy>=1.26.4,<3", "PyYAML>=6.0.3,<7"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Science/Research", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Bio-Informatics"]

[project.optional-dependencies]
io = ["pyBigWig>=0.3.24,<0.4", "cooler>=0.10,<0.11", "pandas>=2.2,<3"]
ml = ["scikit-learn>=1.6,<2", "scipy>=1.15,<2"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "build>=1.2,<2", "ruff>=0.11,<1", "pandas>=2.2,<3"]

[project.scripts]
pace = "pace_livestock.cli:main"

[project.urls]
Repository = "https://github.com/shenlinyong/PACE"
Issues = "https://github.com/shenlinyong/PACE/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pace_livestock"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
